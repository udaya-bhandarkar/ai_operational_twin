name: CI

on:
  push:
    branches: [main, Backend]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  # Stage 1 — lint (ruff) + import smoke test
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Create venv
        run: uv venv .venv --python 3.11

      - name: Install dev deps
        run: uv pip install -e ".[dev]" --python .venv/bin/python

      - name: Ruff lint
        run: .venv/bin/python -m ruff check .

      - name: Import smoke test
        run: .venv/bin/python -c "from agents.supervisor.graph import make_graph; print('graph import OK')"
        env:
          ANTHROPIC_API_KEY: "dummy-key-for-import-check"
          BACKEND_ENV: dev

  # Stage 2 — unit tests (no API calls)
  test:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Create venv
        run: uv venv .venv --python 3.11

      - name: Install dev deps
        run: uv pip install -e ".[dev]" --python .venv/bin/python

      - name: Run unit tests
        run: .venv/bin/python -m pytest tests/ -v
        env:
          BACKEND_ENV: dev
          ANTHROPIC_API_KEY: "dummy-key-for-tests"
